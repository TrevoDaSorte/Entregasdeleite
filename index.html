<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🥛 Entregas de Leite</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>

<body>

<div class="topo">

<img src="https://images.unsplash.com/photo-1500595046743-cd271d694d30?q=80&w=1200&auto=format&fit=crop">

<img src="https://upload.wikimedia.org/wikipedia/commons/0/0c/Cow_female_black_white.jpg">

<h1>🥛 Entregas de Leite</h1>

</div>

<div class="box">

<h2>Cadastrar Cliente</h2>

<input type="text"
id="novoCliente"
placeholder="Nome do cliente">

<button onclick="cadastrarCliente()">
Cadastrar
</button>

<button onclick="limparBanco()"
style="background:red;">
🗑 Limpar Banco
</button>

<button onclick="baixarBanco()"
style="background:#2563eb;">
⬇ Download Banco
</button>

<button
onclick="document.getElementById('restaurarInput').click()"
style="background:#7c3aed;">
📂 Restaurar Backup
</button>

<input type="file"
id="restaurarInput"
accept=".json"
style="display:none"
onchange="restaurarBackup(event)">

<div id="listaClientes"></div>

</div>

<div class="box">

<h2>Registrar Entrega</h2>

<select id="clienteSelect"></select>

<input type="number"
id="litros"
placeholder="Litros">

<select id="dia">

<option>Segunda</option>
<option>Terça</option>
<option>Quarta</option>
<option>Quinta</option>
<option>Sexta</option>
<option>Sábado</option>
<option>Domingo</option>

</select>

<select id="haver">

<option value="💲">
💲 Recebido
</option>

<option value="❕">
❕ Não Recebido
</option>

</select>

<input type="number"
id="valor"
placeholder="Valor (opcional)">

<button onclick="salvarEntrega()">
Salvar
</button>

</div>

<div class="box">

<h2>Entregas</h2>

<table>

<thead>

<tr>

<th>Cliente</th>
<th>Litros</th>
<th>Dia</th>
<th>Data</th>
<th>Haver</th>
<th>Valor</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="tabela"></tbody>

</table>

<div id="totalDia">
🥛 Total do Dia: 0L
</div>

<div id="totalSemana">
📦 Total da Semana: 0L
</div>

<div id="totalRecebido">
💰 Total Recebido: R$ 0
</div>

<div id="totalPendente">
❕ Total Pendente: R$ 0
</div>

</div>

<script src="script.js"></script>

</body>
</html>
